<!doctype html>
<meta charset="utf-8">
<title>phone-linen</title>
<style>
  :root {
    --paper: #FFF0DC; --paper-light: #FFFAF3; --paper-deep: #F3DFBF;
    --ink: #2E4B68; --orange: #F35F32;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px; overflow: hidden;
    display: grid; place-items: center;
    background:
      radial-gradient(120% 80% at 50% 15%, var(--paper-light) 0%, var(--paper) 45%, var(--paper-deep) 100%);
    position: relative;
  }
  /* soft woven-linen texture, kept subtle so AI motion reads as light not noise */
  body::after {
    content: ''; position: absolute; inset: 0; opacity: .28; mix-blend-mode: multiply;
    background-image:
      repeating-linear-gradient(0deg, rgba(46,75,104,.05) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg, rgba(46,75,104,.04) 0 1px, transparent 1px 4px);
  }
  .glow {
    position: absolute; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(243,95,50,.28) 0%, transparent 68%);
    top: 8%; left: 50%; transform: translateX(-50%); filter: blur(30px);
  }
  .phone {
    position: relative; width: 560px; aspect-ratio: 390 / 844;
    border-radius: 62px; padding: 13px;
    background: linear-gradient(160deg, #3a3129 0%, #211a13 55%, #2f2720 100%);
    box-shadow:
      0 60px 120px -30px rgba(46,75,104,.5),
      0 20px 40px -12px rgba(46,75,104,.32),
      inset 0 0 0 1px rgba(255,255,255,.09);
    transform: rotate(-3deg);
  }
  .screen {
    width: 100%; height: 100%; border-radius: 50px; overflow: hidden;
    background: var(--paper-light); display: block;
  }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
</style>
<div class="glow"></div>
<div class="phone"><div class="screen"><img id="shot" alt=""></div></div>
<script>
  const src = new URLSearchParams(location.search).get('src');
  if (src) document.getElementById('shot').src = src;
</script>
